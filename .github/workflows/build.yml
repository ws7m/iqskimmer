# Builds IQ Skimmer for macOS, Windows and Linux on every push and pull request.
# Each build is uploaded as a workflow artifact. Pushing a tag like v0.2.0 also creates a
# GitHub release with all three attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # for attaching builds to releases on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            artifact: iqskimmer-macos-arm64.zip
          - os: windows-latest
            artifact: iqskimmer-windows-x64.zip
          - os: ubuntu-latest
            artifact: iqskimmer-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Test
        run: cargo test --release

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          ./scripts/macos-app.sh
          ditto -c -k --keepParent "target/release/IQ Skimmer.app" "${{ matrix.artifact }}"

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          Compress-Archive -Path target/release/iqskimmer.exe, README.md -DestinationPath "${{ matrix.artifact }}"

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          tar -czf "${{ matrix.artifact }}" -C target/release iqskimmer -C "$GITHUB_WORKSPACE" README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
